services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./src:/app/src          # mount source for hot reload
    command: uvicorn chatbot_backend.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped